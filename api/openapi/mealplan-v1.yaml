# Check latest: https://github.com/OAI/OpenAPI-Specification/releases
openapi: "3.2.0"
info:
  title: PudimProductivity Meal Planning API
  description: |
    Weekly meal plans: a grid of slots (breakfast/lunch/dinner/snack per day),
    each optionally referencing a recipe. The shopping list is generated by
    aggregating the ingredients of all slotted recipes.
  version: "0.1.0"
  contact:
    name: PudimProductivity Team
    url: https://github.com/diegobraga92/PudimProductivity

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /api/v1/mealplans:
    get:
      operationId: listMealPlans
      summary: List meal plans
      description: Returns plans newest-first (slots omitted).
      security: []
      tags:
        - MealPlans
      responses:
        "200":
          description: A list of meal plans.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MealPlan"
    post:
      operationId: createMealPlan
      summary: Create a meal plan
      security: []
      tags:
        - MealPlans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMealPlanRequest"
      responses:
        "201":
          description: Meal plan created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPlan"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/mealplans/{planId}:
    parameters:
      - $ref: "#/components/parameters/planId"
    get:
      operationId: getMealPlan
      summary: Get a meal plan (with slots)
      security: []
      tags:
        - MealPlans
      responses:
        "200":
          description: The meal plan with its slots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPlan"
        "404":
          description: Meal plan not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateMealPlan
      summary: Update a meal plan (full replacement of slots)
      security: []
      tags:
        - MealPlans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMealPlanRequest"
      responses:
        "200":
          description: The updated meal plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPlan"
        "404":
          description: Meal plan not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMealPlan
      summary: Delete a meal plan
      security: []
      tags:
        - MealPlans
      responses:
        "204":
          description: Meal plan deleted.
        "404":
          description: Meal plan not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/mealplans/{planId}/slots/{slotId}:
    parameters:
      - $ref: "#/components/parameters/planId"
      - $ref: "#/components/parameters/slotId"
    put:
      operationId: assignMealSlot
      summary: Assign a recipe (and/or notes) to a slot
      security: []
      tags:
        - MealPlans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignSlotRequest"
      responses:
        "204":
          description: Slot updated.
        "404":
          description: Meal plan or slot not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/mealplans/{planId}/shopping-list:
    parameters:
      - $ref: "#/components/parameters/planId"
    post:
      operationId: generateShoppingList
      summary: Generate (replace) the shopping list from slotted recipes
      security: []
      tags:
        - MealPlans
      responses:
        "200":
          description: The regenerated shopping list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShoppingItem"
        "404":
          description: Meal plan not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getShoppingList
      summary: Get the current shopping list
      security: []
      tags:
        - MealPlans
      responses:
        "200":
          description: The shopping list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShoppingItem"

  /api/v1/mealplans/{planId}/shopping-list/{itemId}:
    parameters:
      - $ref: "#/components/parameters/planId"
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: toggleShoppingItem
      summary: Toggle a shopping item's checked state
      security: []
      tags:
        - MealPlans
      responses:
        "204":
          description: Item toggled.
        "404":
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/mealplans/{planId}/publish:
    parameters:
      - $ref: "#/components/parameters/planId"
    post:
      operationId: publishMealPlan
      summary: Publish a meal plan
      description: Marks the plan published and emits the mealplan.published event.
      security: []
      tags:
        - MealPlans
      responses:
        "204":
          description: Meal plan published.
        "404":
          description: Meal plan not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    planId:
      name: planId
      in: path
      required: true
      description: The meal plan UUID.
      schema:
        type: string
        format: uuid
    slotId:
      name: slotId
      in: path
      required: true
      description: The meal slot UUID.
      schema:
        type: string
        format: uuid

  schemas:
    MealType:
      type: string
      enum: [breakfast, lunch, dinner, snack]

    MealSlot:
      type: object
      required: [id, date, meal_type]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        meal_type:
          $ref: "#/components/schemas/MealType"
        recipe_id:
          type: [string, "null"]
          format: uuid
          description: Referenced recipe, if any.
        notes:
          type: string

    MealPlan:
      type: object
      required: [id, name, start_date, end_date, is_published, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_published:
          type: boolean
        slots:
          type: array
          items:
            $ref: "#/components/schemas/MealSlot"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SlotInput:
      type: object
      required: [date, meal_type]
      properties:
        date:
          type: string
          format: date
        meal_type:
          $ref: "#/components/schemas/MealType"
        recipe_id:
          type: [string, "null"]
          format: uuid
        notes:
          type: string

    CreateMealPlanRequest:
      type: object
      required: [start_date, end_date]
      properties:
        name:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        slots:
          type: array
          items:
            $ref: "#/components/schemas/SlotInput"

    AssignSlotRequest:
      type: object
      properties:
        recipe_id:
          type: [string, "null"]
          format: uuid
          description: Recipe to assign to the slot.
        notes:
          type: string

    ShoppingItem:
      type: object
      required: [id, ingredient_name, is_checked]
      properties:
        id:
          type: string
          format: uuid
        ingredient_name:
          type: string
        quantity_agg:
          type: string
          description: Aggregated free-text quantity (e.g. "3" or "2 + 1.5").
        unit:
          type: string
        is_checked:
          type: boolean

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

