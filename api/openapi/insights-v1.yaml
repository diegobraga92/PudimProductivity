# TODO: Check about removing insights
openapi: "3.2.0"
info:
  title: Insights API
  version: "0.1.0"
  license:
    name: MIT
    url: https://github.com/diegobraga92/PudimProductivity/blob/main/LICENSE

servers:
  - url: /
    description: Current server

paths:
  /api/v1/insights/weekly:
    get:
      operationId: getWeeklyInsights
      summary: Get weekly productivity report
      description: |
        Returns the report for the Monday-starting week containing `date`
        (defaults to today). The report is computed once and cached in
        `insight_reports`.
      # TODO: Check 'security:' of all openapi yaml
      security: []
      tags:
        - Insights
      parameters:
        - name: date
          in: query
          required: false
          description: Any date in the target week (YYYY-MM-DD). Defaults to today.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Weekly report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightReport"
        "400":
          description: Invalid date format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "date must be YYYY-MM-DD"

    HabitStat:
      type: object
      required: [task_id, title, count]
      properties:
        task_id:
          type: string
          format: uuid
        title:
          type: string
        count:
          type: integer

    WeeklyStats:
      type: object
      required: [week_start, total_completions, completions_per_day, focus_minutes, focus_sessions, recipes_created]
      properties:
        week_start:
          type: string
          format: date
        total_completions:
          type: integer
        completions_per_day:
          type: number
        top_habits:
          type: array
          items:
            $ref: "#/components/schemas/HabitStat"
        focus_minutes:
          type: integer
        focus_sessions:
          type: integer
        recipes_created:
          type: integer

    InsightReport:
      type: object
      required: [week_start, stats, report_text, generated_at]
      properties:
        week_start:
          type: string
          format: date
        stats:
          $ref: "#/components/schemas/WeeklyStats"
        report_text:
          type: string
          description: Template-rendered weekly summary.
        llm_summary:
          type: [string, "null"]
          description: Optional LLM-generated paragraph. Only when the insights.llm_enabled flag is on.
        generated_at:
          type: string
          format: date-time
