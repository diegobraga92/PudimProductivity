openapi: "3.2.0"
info:
  title: Admin API
  version: "0.1.0"
  license:
    name: MIT
    url: https://github.com/diegobraga92/PudimProductivity/blob/main/LICENSE

servers:
  - url: /
    description: Current server

paths:
  /api/v1/admin/score-providers:
    get:
      operationId: getScoreProviders
      summary: Read the score provider configuration
      description: |
        Returns the mapping of score providers per media type, and enabled state.
        Requires admin role.
      security: []
      tags:
        - Admin
      responses:
        "200":
          description: Score provider configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreProvidersConfig"
        "403":
          description: Missing admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      operationId: updateScoreProviders
      summary: Save the score provider configuration
      description: |
        Validates and applies a new score provider config. 
        Requires the admin role.
      security: []
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreProvidersUpdate"
      responses:
        "200":
          description: Resulting config (masked).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreProvidersConfig"
        "400":
          description: Validation error (unknown provider, unsupported assignment, missing key).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing admin role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    MediaType:
      type: string
      enum: [movie, series, book, game]

    ScoreProvider:
      type: object
      required: [name, base_url, api_key_set, supported_types]
      properties:
        name:
          type: string
          description: Registered provider name (e.g. "omdb", "rawg").
        base_url:
          type: string
          description: Override base URL, or empty to use default.
        api_key_set:
          type: boolean
          description: If an API key is stored.
        supported_types:
          type: array
          items:
            $ref: "#/components/schemas/MediaType"

    ScoreProvidersConfig:
      type: object
      required: [movie_provider, series_provider, game_provider, book_provider, lookup_enabled, providers]
      properties:
        movie_provider:
          type: string
          description: Provider for movies ("" or "none" = disabled).
        series_provider:
          type: string
          description: Provider for series ("" or "none" = disabled).
        game_provider:
          type: string
          description: Provider for games ("" or "none" = disabled).
        book_provider:
          type: string
          description: Provider for books ("" or "none" = disabled).
        lookup_enabled:
          type: boolean
          description: Value of library.score_lookup_enabled feature flag.
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ScoreProvider"

    ScoreProviderUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Provider to update.
        api_key:
          type: [string, "null"]
          description: nil = keep stored; "" = clear it.
        base_url:
          type: [string, "null"]
          description: nil = keep stored; "" = use default.

    ScoreProvidersUpdate:
      type: object
      required: [movie_provider, series_provider, game_provider, book_provider]
      properties:
        movie_provider:
          type: string
        series_provider:
          type: string
        game_provider:
          type: string
        book_provider:
          type: string
        lookup_enabled:
          type: boolean
          description: Optional. Omit to leave unchanged.
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ScoreProviderUpdate"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
