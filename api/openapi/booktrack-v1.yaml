# Check latest: https://github.com/OAI/OpenAPI-Specification/releases
openapi: "3.2.0"
info:
  title: PudimProductivity Book Tracking API
  description: |
    Track books through want_to_read / reading / read. Books can be added by
    ISBN (metadata looked up via the Google Books API) or entered manually.
  version: "0.1.0"
  contact:
    name: PudimProductivity Team
    url: https://github.com/diegobraga92/PudimProductivity

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /api/v1/books:
    get:
      operationId: listBooks
      summary: List books
      description: Returns books newest-first, optionally filtered by reading status.
      security: []
      tags:
        - Books
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/BookStatus"
      responses:
        "200":
          description: A list of books.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Book"
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: addBookManual
      summary: Add a book manually
      description: Adds a book from client-provided fields (no external lookup).
      security: []
      tags:
        - Books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddManualRequest"
      responses:
        "201":
          description: Book added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "409":
          description: A book with this ISBN is already in the library.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/books/by-isbn:
    post:
      operationId: addBookByISBN
      summary: Add a book by ISBN
      description: |
        Looks up book metadata from the Google Books API and adds the book to
        the library with status want_to_read. Returns 502 when the external
        lookup fails or is not configured.
      security: []
      tags:
        - Books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddByISBNRequest"
      responses:
        "201":
          description: Book added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "404":
          description: No volume found for the ISBN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A book with this ISBN is already in the library.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: External lookup failed (network/Google outage).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/books/{bookId}:
    parameters:
      - $ref: "#/components/parameters/bookId"
    get:
      operationId: getBook
      summary: Get a book
      security: []
      tags:
        - Books
      responses:
        "200":
          description: The book.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "404":
          description: Book not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBook
      summary: Delete a book
      security: []
      tags:
        - Books
      responses:
        "204":
          description: Book deleted.
        "404":
          description: Book not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/books/{bookId}/status:
    parameters:
      - $ref: "#/components/parameters/bookId"
    put:
      operationId: updateBookStatus
      summary: Update a book's reading status
      security: []
      tags:
        - Books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusRequest"
      responses:
        "204":
          description: Status updated.
        "400":
          description: Invalid status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Book not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    bookId:
      name: bookId
      in: path
      required: true
      description: The book UUID.
      schema:
        type: string
        format: uuid

  schemas:
    BookStatus:
      type: string
      enum: [want_to_read, reading, read]
      description: Reading progress state.

    Book:
      type: object
      required: [id, isbn, title, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        isbn:
          type: string
          description: Normalized ISBN (digits, uppercased X for ISBN-10).
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        publisher:
          type: string
        published_date:
          type: string
          description: Free-text date from Google Books (e.g. "2019-09-17").
        description:
          type: string
        page_count:
          type: integer
        thumbnail_url:
          type: string
        status:
          $ref: "#/components/schemas/BookStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AddManualRequest:
      type: object
      required: [isbn, title]
      properties:
        isbn:
          type: string
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        publisher:
          type: string
        published_date:
          type: string
        description:
          type: string
        page_count:
          type: integer
        thumbnail_url:
          type: string
        status:
          $ref: "#/components/schemas/BookStatus"

    AddByISBNRequest:
      type: object
      required: [isbn]
      properties:
        isbn:
          type: string
          description: ISBN-10 or ISBN-13; separators are stripped.

    UpdateStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/BookStatus"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

