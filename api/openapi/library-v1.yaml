# Check latest: https://github.com/OAI/OpenAPI-Specification/releases
openapi: "3.2.0"
info:
  title: PudimProductivity Library API
  description: |
    Track media you consume — movies, series, books and games — with a simple
    done flag, a release year and optional notes. Replaces the book-specific
    tracking API (booktrack-v1.yaml).
  version: "0.1.0"
  contact:
    name: PudimProductivity Team
    url: https://github.com/diegobraga92/PudimProductivity

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /api/v1/library:
    get:
      operationId: listLibraryItems
      summary: List library items
      description: Returns items newest-first, optionally filtered by media type, done status and/or subtype (genre/console).
      security: []
      tags:
        - Library
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MediaType"
        - name: done
          in: query
          required: false
          schema:
            type: boolean
            description: When true, only done items; when false, only unfinished.
        - name: subtype
          in: query
          required: false
          schema:
            type: string
            description: Exact genre/console match, case-insensitive (e.g. "Nintendo Switch", "Sci-fi").
      responses:
        "200":
          description: A list of library items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryItem"
        "400":
          description: Invalid filter value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/library/subtypes:
    get:
      operationId: listLibrarySubtypes
      summary: List distinct subtypes for the filter dropdown
      description: |
        Returns the distinct non-empty genre/console values present in the
        library, sorted alphabetically. Optionally scoped to a media type so
        games show consoles and movies/series/books show genres.
      security: []
      tags:
        - Library
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MediaType"
      responses:
        "200":
          description: Distinct subtype values.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          description: Invalid type filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createLibraryItem
      summary: Add an item to the library
      description: Adds a single item from client-provided fields.
      security: []
      tags:
        - Library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryItemRequest"
      responses:
        "201":
          description: Item created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryItem"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/library/score/search:
    get:
      operationId: searchLibraryScores
      summary: Search for a media score
      description: |
        Looks up ratings for a title from the configured score provider (OMDb/IMDb
        for films and series, RAWG/Metacritic for games). Returns a small list of
        candidates so the client can confirm the right title before saving its
        score. Returns 503 when the feature is disabled or no provider is configured.
      security: []
      tags:
        - Library
      parameters:
        - name: type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/MediaType"
        - name: query
          in: query
          required: true
          schema:
            type: string
            description: Title to search for.
        - name: year
          in: query
          required: false
          schema:
            type: integer
            description: Optional release year to narrow the search.
      responses:
        "200":
          description: Matching titles with their ratings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScoreCandidate"
        "400":
          description: Missing or invalid parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The rating provider could not be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Score lookup is disabled or not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/library/score/batch:
    post:
      operationId: searchLibraryScoresBatch
      summary: Look up scores for many titles at once
      description: |
        Used by the CSV import auto-scoring flow. Each item is looked up against
        the configured provider independently with bounded concurrency; per-item
        failures are reported inline (in the result's error field) rather than
        failing the whole request. Up to 100 items per call. Returns 503 when
        the feature is disabled or no provider is configured.
      security: []
      tags:
        - Library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreBatchRequest"
      responses:
        "200":
          description: Per-item lookup results, in request order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreBatchResponse"
        "400":
          description: Empty, malformed or oversized payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The rating provider could not be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Score lookup is disabled or not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/library/import:
    post:
      operationId: importLibraryItems
      summary: Bulk import library items
      description: |
        Creates multiple items in a single transaction (used by the CSV import
        flow). Valid rows are inserted; invalid rows are skipped and reported
        with their 1-based row number.
      security: []
      tags:
        - Library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportItemsRequest"
      responses:
        "200":
          description: Import summary with created items and skipped rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Empty, malformed or oversized payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/library/{itemId}:
    parameters:
      - $ref: "#/components/parameters/itemId"
    get:
      operationId: getLibraryItem
      summary: Get a library item
      security: []
      tags:
        - Library
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryItem"
        "404":
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      operationId: updateLibraryItem
      summary: Update a library item
      description: |
        Partial update — omitted fields are left unchanged. Send {"done": true}
        to mark an item as consumed/read/watched/played.
      security: []
      tags:
        - Library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLibraryItemRequest"
      responses:
        "200":
          description: The updated item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryItem"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteLibraryItem
      summary: Delete a library item
      security: []
      tags:
        - Library
      responses:
        "204":
          description: Item deleted.
        "404":
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    itemId:
      name: itemId
      in: path
      required: true
      description: The library item UUID.
      schema:
        type: string
        format: uuid

  schemas:
    MediaType:
      type: string
      enum: [movie, series, book, game]
      description: Kind of media the item represents.

    LibraryItem:
      type: object
      required: [id, name, media_type, done, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The title of the item.
        media_type:
          $ref: "#/components/schemas/MediaType"
        release_year:
          type: integer
          nullable: true
          description: Year the media was released; null when unknown.
        done:
          type: boolean
          description: True when the item has been consumed/read/watched/played.
        notes:
          type: string
          description: Optional free-text notes or comments.
        subtype:
          type: string
          description: Optional free-text sub-category (e.g. "Console" for games, "Genre" for movies/series/books).
        score:
          type: number
          nullable: true
          description: |
            Optional rating on a 0-100 scale (IMDb 8.7, Metacritic 95, ...).
            Null when no score has been recorded.
        score_source:
          type: string
          description: |
            Where the score came from (e.g. "imdb", "metacritic", "custom").
            Empty when no score is recorded.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ScoreCandidate:
      type: object
      required: [title, score, score_source]
      properties:
        title:
          type: string
          description: The provider's title for the match.
        year:
          type: integer
          description: Release year when the provider reports one.
        score:
          type: number
          description: Rating on the same 0-100 scale as library items.
        score_source:
          type: string
          description: e.g. "imdb" or "metacritic".
        external_id:
          type: string
          description: Provider-specific identifier (e.g. IMDb tt id, RAWG id).
        url:
          type: string
          description: Link to the provider's page for the title.

    ScoreBatchItem:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          description: Title to look up.
        type:
          $ref: "#/components/schemas/MediaType"
        year:
          type: integer
          nullable: true
          description: Optional release year to narrow the search.

    ScoreBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ScoreBatchItem"

    ScoreBatchResult:
      type: object
      required: [index, candidates]
      properties:
        index:
          type: integer
          description: Echo of the item's position in the request, so results map to rows.
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/ScoreCandidate"
        error:
          type: string
          description: Present when the row or its lookup failed (e.g. invalid type, provider error).

    ScoreBatchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ScoreBatchResult"

    CreateLibraryItemRequest:
      type: object
      required: [name, media_type]
      properties:
        name:
          type: string
        media_type:
          $ref: "#/components/schemas/MediaType"
        release_year:
          type: integer
          nullable: true
        done:
          type: boolean
          default: false
        notes:
          type: string
        subtype:
          type: string
          description: Optional free-text sub-category (e.g. "Console" for games, "Genre" for movies/series/books).
        score:
          type: number
          nullable: true
          description: Optional rating on a 0-100 scale.
        score_source:
          type: string
          description: Where the score came from (e.g. "imdb", "metacritic").

    UpdateLibraryItemRequest:
      type: object
      properties:
        name:
          type: string
        media_type:
          $ref: "#/components/schemas/MediaType"
        release_year:
          type: integer
          nullable: true
        done:
          type: boolean
        notes:
          type: string
        subtype:
          type: string
          description: Optional free-text sub-category. Omit to keep the current value; send "" to clear it.
        score:
          type: number
          nullable: true
          description: |
            Optional rating on a 0-100 scale. Omit to keep the current value;
            send null to clear it.
        score_source:
          type: string
          description: Where the score came from. Send "" to clear it.

    ImportItemsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreateLibraryItemRequest"
          description: Up to 5000 items per import.

    ImportError:
      type: object
      required: [row, message]
      properties:
        row:
          type: integer
          description: 1-based row number in the original CSV (data rows only).
        message:
          type: string

    ImportResult:
      type: object
      required: [imported]
      properties:
        imported:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/LibraryItem"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ImportError"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

