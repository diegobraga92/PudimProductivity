openapi: "3.2.0"
info:
  title: Library API
  version: "0.1.0"
  license:
    name: MIT
    url: https://github.com/diegobraga92/PudimProductivity/blob/main/LICENSE

servers:
  - url: /
    description: Current server

paths:
  /api/v1/library:
    get:
      operationId: listLibraryItems
      summary: List library items
      description: Returns items newest-first, optionally filtered.
      security: []
      tags:
        - Library
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MediaType"
        - name: done
          in: query
          required: false
          schema:
            type: boolean
        - name: subtype
          in: query
          required: false
          schema:
            type: string
            description: Case-insensitive match (e.g. "Nintendo Switch", "Sci-fi").
      responses:
        "200":
          description: List of library items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryItem"
        "400":
          description: Invalid filter value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/library/subtypes:
    get:
      operationId: listLibrarySubtypes
      summary: List distinct subtypes
      security: []
      tags:
        - Library
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MediaType"
      responses:
        "200":
          description: Subtype values.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          description: Invalid type filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createLibraryItem
      summary: Add an item to the library
      security: []
      tags:
        - Library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryItemRequest"
      responses:
        "201":
          description: Item created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryItem"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/library/score/search:
    get:
      operationId: searchLibraryScores
      summary: Search for a media score
      description: |
        Looks up ratings for a title from the configured score provider. 
        Returns a short list of candidates for confirmation before saving.
      security: []
      tags:
        - Library
      parameters:
        - name: type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/MediaType"
        - name: query
          in: query
          required: true
          schema:
            type: string
            description: Title to search for.
        - name: year
          in: query
          required: false
          schema:
            type: integer
            description: Optional release year.
      responses:
        "200":
          description: Matching titles with their ratings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScoreCandidate"
        "400":
          description: Missing or invalid parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The rating provider could not be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Score lookup is disabled or not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/library/score/batch:
    post:
      operationId: searchLibraryScoresBatch
      summary: Look up scores for many titles at once
      description: |
        Each item is looked up independently with bounded concurrency. 
        Per-item failures are reported inline (in the result's error field). 
        Up to 100 items per call.
      security: []
      tags:
        - Library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreBatchRequest"
      responses:
        "200":
          description: Per-item lookup results, in request order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreBatchResponse"
        "400":
          description: Empty, malformed or oversized payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The rating provider could not be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Score lookup is disabled or not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/library/import:
    post:
      operationId: importLibraryItems
      summary: Bulk import library items
      description: |
        Creates multiple items in a single transaction. Valid rows are inserted; 
        invalid rows are skipped and reported with their 1-based row number.
      security: []
      tags:
        - Library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportItemsRequest"
      responses:
        "200":
          description: Import summary with created items and skipped rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Empty, malformed or oversized payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/library/{itemId}:
    parameters:
      - $ref: "#/components/parameters/itemId"
    get:
      operationId: getLibraryItem
      summary: Get a library item
      security: []
      tags:
        - Library
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryItem"
        "404":
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      operationId: updateLibraryItem
      summary: Update a library item
      description: Omitted fields are left unchanged.
      security: []
      tags:
        - Library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLibraryItemRequest"
      responses:
        "200":
          description: The updated item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryItem"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteLibraryItem
      summary: Delete a library item
      security: []
      tags:
        - Library
      responses:
        "204":
          description: Item deleted.
        "404":
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    itemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    MediaType:
      type: string
      enum: [movie, series, book, game]

    LibraryItem:
      type: object
      required: [id, name, media_type, done, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        media_type:
          $ref: "#/components/schemas/MediaType"
        release_year:
          type: [integer, "null"]
        done:
          type: boolean
        notes:
          type: string
        subtype:
          type: string
          description: Optional free-text sub-category.
        score:
          type: [number, "null"]
          description: |
            Optional rating on a 0-100 scale (IMDb 8.7, Metacritic 95, ...).
            Null when no score has been recorded.
        score_source:
          type: string
          description: |
            Where the score came from (e.g. "imdb", "metacritic", "custom").
            Empty when no score is recorded.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ScoreCandidate:
      type: object
      required: [title, score, score_source]
      properties:
        title:
          type: string
          description: The provider's title for the match.
        year:
          type: integer
          description: Release year when the provider reports one.
        score:
          type: number
          description: Rating on the same 0-100 scale as library items.
        score_source:
          type: string
          description: e.g. "imdb" or "metacritic".
        external_id:
          type: string
          description: Provider-specific identifier (e.g. IMDb tt id, RAWG id).
        url:
          type: string
          description: Link to the provider's page for the title.

    ScoreBatchItem:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          description: Title to look up.
        type:
          $ref: "#/components/schemas/MediaType"
        year:
          type: [integer, "null"]
          description: Optional release year to narrow the search.

    ScoreBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ScoreBatchItem"

    ScoreBatchResult:
      type: object
      required: [index, candidates]
      properties:
        index:
          type: integer
          description: Item's position in the request, for mapping.
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/ScoreCandidate"
        error:
          type: string
          description: e.g. invalid type, provider error.

    ScoreBatchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ScoreBatchResult"

    CreateLibraryItemRequest:
      type: object
      required: [name, media_type]
      properties:
        name:
          type: string
        media_type:
          $ref: "#/components/schemas/MediaType"
        release_year:
          type: [integer, "null"]
        done:
          type: boolean
          default: false
        notes:
          type: string
        subtype:
          type: string
          description: Optional free-text sub-category.
        score:
          type: [number, "null"]
          description: Optional rating on a 0-100 scale.
        score_source:
          type: string
          description: Where the score came from (e.g. "imdb", "metacritic").

    UpdateLibraryItemRequest:
      type: object
      properties:
        name:
          type: string
        media_type:
          $ref: "#/components/schemas/MediaType"
        release_year:
          type: [integer, "null"]
        done:
          type: boolean
        notes:
          type: string
        subtype:
          type: string
          description: Omit to keep the current value; send "" to clear it.
        score:
          type: [number, "null"]
          description: Omit to keep the current value; send null to clear it.
        score_source:
          type: string
          description: Where the score came from. Send "" to clear it.

    ImportItemsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreateLibraryItemRequest"
          description: Up to 5000 items per import.

    ImportError:
      type: object
      required: [row, message]
      properties:
        row:
          type: integer
          description: 1-based row number in the original CSV (data rows only).
        message:
          type: string

    ImportResult:
      type: object
      required: [imported]
      properties:
        imported:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/LibraryItem"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ImportError"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

