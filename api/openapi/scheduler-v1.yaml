openapi: "3.2.0"
info:
  title: Scheduler API
  version: "0.1.0"
  license:
    name: MIT
    url: https://github.com/diegobraga92/PudimProductivity/blob/main/LICENSE

servers:
  - url: /
    description: Current server

paths:
  /api/v1/schedule:
    get:
      operationId: getDailySchedule
      summary: Get task plan
      security: []
      tags:
        - Scheduler
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The daily plan.
          content:
            application/json:
              schema:
                # TODO: Change name from Suggestion
                $ref: "#/components/schemas/Suggestion"
        "400":
          description: Invalid date format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    SlotKind:
      type: string
      enum: [habit, todo]

    ScheduleSlot:
      type: object
      required: [task_id, title, start_time, end_time, kind]
      properties:
        task_id:
          type: string
          format: uuid
        title:
          type: string
        start_time:
          type: string
          description: HH:MM 24-hour.
        end_time:
          type: string
          description: HH:MM 24-hour.
        kind:
          $ref: "#/components/schemas/SlotKind"

    # TODO: Check if used, if not, remove
    Suggestion:
      type: object
      required: [date, slots, free_hours, avg_per_day, pending_count]
      properties:
        date:
          type: string
          format: date
        slots:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleSlot"
        free_hours:
          type: integer
          description: Unused work hours remaining after suggestions.
        avg_per_day:
          type: number
          description: Average completions/day over the last 14 days (profile).
        pending_count:
          type: integer
          description: Number of pending one-off todos scheduled for this date.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
