openapi: "3.2.0"
info:
  title: Health API
  version: "0.1.0"
  license:
    name: MIT
    url: https://github.com/diegobraga92/PudimProductivity/blob/main/LICENSE

servers:
  - url: /
    description: Current server

paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Health check
      # TODO: Include other services, like RabbitMQ
      description: Returns the health status of the backend service, including DB and other connectivity.
      security: []
      tags:
        - Health
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service is unhealthy (e.g., database down).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - version
        - db
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
          description: Overall service status.
          example: ok
        version:
          type: string
          description: Application version.
          example: "0.0.1"
        db:
          type: string
          enum: [connected, disconnected]
          description: Database connectivity status.
          example: connected