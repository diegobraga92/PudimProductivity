# Check latest: https://github.com/OAI/OpenAPI-Specification/releases
openapi: "3.2.0"
info:
  title: PudimProductivity Media API
  description: |
    Phase 9b media processing endpoints. Currently one endpoint: barcode →
    ISBN scanning (pure-Go gozxing decoder; no external service or API key).
  version: "0.1.0"

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /api/v1/media/scan-isbn:
    post:
      operationId: scanIsbn
      summary: Decode an ISBN barcode from an uploaded image
      description: |
        Accepts a multipart form with an `image` file (JPEG/PNG/GIF) containing
        a book barcode (EAN-13 / UPC-A / EAN-8). Returns the decoded numeric
        payload; the client then feeds it into the existing book-lookup
        endpoints (POST /api/v1/books/by-isbn).
      security: []
      tags:
        - Media
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: The barcode image to decode.
      responses:
        "200":
          description: Barcode decoded successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"
        "400":
          description: Not a multipart request, or image could not be decoded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: No barcode found in the image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ScanResult:
      type: object
      required: [isbn]
      properties:
        isbn:
          type: string
          description: Decoded numeric barcode payload (usually the 13-digit ISBN-13).
          example: "9780553386790"
