openapi: "3.2.0"
info:
  title: PudimProductivity Planner API
  description: |
    Weekly planner — time-blocked entries for recurring weekly schedules.
    Entries are simple time blocks (e.g., "9-11AM Cardio on Mon/Wed/Fri")
    with no completion tracking, purely for visual scheduling.
  version: "0.1.0"
  contact:
    name: PudimProductivity Team
    url: https://github.com/diegobraga92/PudimProductivity

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /api/v1/planner:
    get:
      operationId: listPlannerEntries
      summary: List all planner entries
      description: Returns all planner entries sorted by start time.
      tags:
        - Planner
      responses:
        "200":
          description: A list of planner entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlannerEntry"

    post:
      operationId: createPlannerEntry
      summary: Create a new planner entry
      description: Creates a new weekly time-block entry.
      tags:
        - Planner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlannerEntryRequest"
      responses:
        "201":
          description: Planner entry created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerEntry"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/planner/{entryId}:
    get:
      operationId: getPlannerEntry
      summary: Get a planner entry by ID
      tags:
        - Planner
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The planner entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerEntry"
        "404":
          description: Planner entry not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      operationId: updatePlannerEntry
      summary: Update a planner entry
      tags:
        - Planner
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlannerEntryRequest"
      responses:
        "200":
          description: Planner entry updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerEntry"
        "400":
          description: Invalid request.
        "404":
          description: Planner entry not found.

    delete:
      operationId: deletePlannerEntry
      summary: Delete a planner entry
      tags:
        - Planner
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Planner entry deleted.
        "404":
          description: Planner entry not found.

components:
  schemas:
    PlannerEntry:
      type: object
      required:
        - id
        - title
        - days
        - start_time
        - end_time
        - color
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier.
        title:
          type: string
          description: Title of the time block (e.g. "Cardio").
        days:
          type: array
          description: Days of the week this entry applies to.
          items:
            $ref: "#/components/schemas/DayOfWeek"
        start_time:
          type: string
          format: time
          example: "09:00"
          description: Start time in HH:MM 24h format.
        end_time:
          type: string
          format: time
          example: "11:00"
          description: End time in HH:MM 24h format.
        color:
          type: string
          example: "#3B82F6"
          description: Hex color for visual distinction.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreatePlannerEntryRequest:
      type: object
      required:
        - title
        - days
        - start_time
        - end_time
      properties:
        title:
          type: string
          description: Title of the time block.
        days:
          type: array
          items:
            $ref: "#/components/schemas/DayOfWeek"
        start_time:
          type: string
          format: time
          example: "09:00"
        end_time:
          type: string
          format: time
          example: "11:00"
        color:
          type: string
          example: "#3B82F6"
          description: Optional hex color. Defaults to blue if omitted.

    UpdatePlannerEntryRequest:
      type: object
      properties:
        title:
          type: string
        days:
          type: array
          items:
            $ref: "#/components/schemas/DayOfWeek"
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        color:
          type: string

    DayOfWeek:
      type: string
      enum: [mon, tue, wed, thu, fri, sat, sun]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string