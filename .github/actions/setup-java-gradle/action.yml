name: Setup Java + Gradle
description: Install Temurin JDK and set up the Gradle caches

inputs:
  java-version:
    required: false
    default: "21"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
    - uses: gradle/actions/setup-gradle@v6
