name: Setup Node

inputs:
  node-version-file:
    required: false
    default: .nvmrc
  cache-dependency-path:
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: npm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
