name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      # Check latest: https://github.com/actions/checkout/releases
      - uses: actions/checkout@v6

      # Check latest: https://github.com/actions/setup-java/releases
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        # Check latest: https://github.com/gradle/actions/releases
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Build debug APK with Gradle
        # API_BASE_URL is set in GitHub → Settings → Secrets and variables → Actions → Variables.
        # If unset, falls back to the emulator loopback.
        run: >
          ./gradlew
          -Papi.base.url="${{ vars.API_BASE_URL || 'http://10.0.2.2:8080/api/v1' }}"
          assembleDebug
        working-directory: mobile

      - name: Rename APK with date
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/app-debug-$(date +%Y-%m-%d).apk"
        working-directory: mobile

      - name: Upload debug APK (stamped)
        # Check latest: https://github.com/actions/upload-artifact/releases
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: mobile/app/build/outputs/apk/debug/app-debug-*.apk
          retention-days: 3
