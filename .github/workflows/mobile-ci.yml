name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
      - ".github/actions/setup-java-gradle/action.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
      - ".github/actions/setup-java-gradle/action.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java-gradle

      - name: Build debug APK
        run: ./gradlew lint assembleDebug
        working-directory: mobile

  release-sign:
    name: Signed Release Build (AAB + APK)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-java-gradle

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 not set — skipping signed release build"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release AAB + APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease
        working-directory: mobile

      - name: Rename release artifacts with date
        working-directory: mobile
        run: |
          DATE=$(date +%Y-%m-%d)
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/pudimproductivity-release-${DATE}.apk"
          mv app/build/outputs/bundle/release/app-release.aab \
             "app/build/outputs/bundle/release/pudimproductivity-release-${DATE}.aab"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: |
            mobile/app/build/outputs/apk/release/pudimproductivity-release-*.apk
            mobile/app/build/outputs/bundle/release/pudimproductivity-release-*.aab
          retention-days: 2
