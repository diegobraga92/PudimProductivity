name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "api/**"
      - "shared/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "api/**"
      - "shared/**"
      - ".github/workflows/web-ci.yml"

env:
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # Check latest: https://github.com/actions/checkout/releases
      - uses: actions/checkout@v6
      # Check latest: https://github.com/actions/setup-node/releases
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit runtime dependencies (npm audit)
        # Gates the *shipped* dependency surface (what runs in the browser).
        # Dev toolchain deps are excluded for one documented exception: the
        # OpenAPI codegen tool (openapi-typescript) pulls
        # @redocly/openapi-core -> js-yaml@4, which has CVE-2026-59870 with
        # NO FIX UPSTREAM and is unreachable (build-time only, parses only our
        # own versioned specs). See docs/security/validation-report.md
        # ("Known accepted findings") for the revisit trigger.
        run: npm audit --omit=dev --audit-level=moderate
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  check-clients:
    name: API Client Drift Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Regenerate client types from OpenAPI specs
        # api/openapi/*.yaml is the source of truth. Any spec change must be
        # committed together with the regenerated types (web/src/api/generated/).
        run: npm run generate:api
      - name: Fail if generated clients drifted from the spec
        # Leaves a diff if the committed generated output does not match what the
        # current specs produce (spec changed without regenerating the client).
        run: git diff --exit-code -- src/api/generated

  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      # Check latest: https://github.com/actions/checkout/releases
      - uses: actions/checkout@v6
      - name: Build Docker image
        # Context is the repo root so web/Dockerfile can COPY shared/i18n (the
        # translations import ../../../shared/i18n). .dockerignore whitelists
        # web/ + shared/i18n so only those trees reach the daemon.
        run: docker build -t pudim-web:ci -f web/Dockerfile .
      - name: Run Trivy
        # Action latest: https://github.com/aquasecurity/trivy-action/releases
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pudim-web:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH