name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "api/**"
      - "shared/**"
      - ".github/workflows/web-ci.yml"
      - ".github/workflows/container-scan.yml"
      - ".github/actions/setup-node/action.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "api/**"
      - "shared/**"
      - ".github/workflows/web-ci.yml"
      - ".github/workflows/container-scan.yml"
      - ".github/actions/setup-node/action.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit runtime dependencies (npm audit)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  check-clients:
    name: API Client Drift Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Regenerate client types from OpenAPI specs
        run: npm run generate:api
      - name: Fail if generated clients drifted from the spec
        run: git diff --exit-code -- src/api/generated

  container-scan:
    name: Container Scan (Trivy)
    uses: ./.github/workflows/container-scan.yml
    with:
      image-name: pudim-web
      dockerfile: web/Dockerfile
      build-context: .