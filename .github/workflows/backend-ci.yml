name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/container-scan.yml"
      - ".github/actions/setup-go/action.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/container-scan.yml"
      - ".github/actions/setup-go/action.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: backend

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./... -v -count=1 -race -coverprofile=coverage.out
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.out

  vuln:
    name: Vulnerability Scan (govulncheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Download dependencies
        run: go mod download
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: go build -o /dev/null ./cmd/server/

  container-scan:
    name: Container Scan (Trivy)
    uses: ./.github/workflows/container-scan.yml
    with:
      image-name: pudim-backend
      dockerfile: backend/Dockerfile
      build-context: backend/

  load-smoke:
    name: Load Smoke Test (k6)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: pudim
          POSTGRES_PASSWORD: t
          POSTGRES_DB: pudimproductivity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pudim -d pudimproductivity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Build backend binary
        run: go build -o /tmp/pudim-backend ./cmd/server/
        working-directory: backend
      - name: Start backend against the CI Postgres
        env:
          DATABASE_URL: postgres://pudim:t@localhost:5432/pudimproductivity?sslmode=disable
          PORT: "18080"
          RABBITMQ_URL: ""
          REDIS_URL: ""
          LOG_LEVEL: warn
        run: |
          nohup /tmp/pudim-backend > /tmp/backend.log 2>&1 &
          echo "backend pid: $!"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:18080/api/v1/health > /dev/null; then
              echo "backend healthy after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:18080/api/v1/health || { echo "backend never became healthy"; cat /tmp/backend.log; exit 1; }
      - name: Install k6
        run: |
          K6_VERSION=2.2.0
          curl --fail --silent --show-error --location \
            "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp
          echo "/tmp/k6-v${K6_VERSION}-linux-amd64" >> "$GITHUB_PATH"
      - name: Run smoke load test
        env:
          BASE_URL: http://localhost:18080/api/v1
        run: k6 run infra/k6/smoke.js