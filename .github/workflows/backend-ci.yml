name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

env:
  # 1.26.6 ships the stdlib fixes for the GOVULNCHECK/Trivy findings in 1.26.5
  # (net/url, crypto/tls, net/http, encoding/xml, encoding/asn1, html/template).
  GO_VERSION: "1.26.6"


jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # Check latest: https://github.com/actions/checkout/releases
      - uses: actions/checkout@v6
      # Check latest: https://github.com/actions/setup-go/releases
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint
        # Action latest: https://github.com/golangci/golangci-lint-action/releases
        # Linter latest: https://github.com/golangci/golangci-lint/releases
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: backend

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./... -v -count=1 -race -coverprofile=coverage.out
      - name: Upload coverage
        # Check latest: https://github.com/actions/upload-artifact/releases
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.out

  vuln:
    name: Vulnerability Scan (govulncheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Download dependencies
        run: go mod download
      - name: Run govulncheck
        # Scans the module graph + source for known vulnerabilities in Go stdlib
        # and dependencies. Fails the build on any finding.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: go build -o /dev/null ./cmd/server/

  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      # Check latest: https://github.com/actions/checkout/releases
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t pudim-backend:ci -f backend/Dockerfile backend/
      - name: Run Trivy
        # Action latest: https://github.com/aquasecurity/trivy-action/releases
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pudim-backend:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

  load-smoke:
    name: Load Smoke Test (k6)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pudim
          POSTGRES_PASSWORD: t
          POSTGRES_DB: pudimproductivity
        ports:
          - 5432:5432
        # Check latest: https://hub.docker.com/_/postgres
        options: >-
          --health-cmd "pg_isready -U pudim -d pudimproductivity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      # Check latest: https://github.com/actions/checkout/releases
      - uses: actions/checkout@v6
      # Check latest: https://github.com/actions/setup-go/releases
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build backend binary
        run: go build -o /tmp/pudim-backend ./cmd/server/
        working-directory: backend
      - name: Start backend against the CI Postgres
        # Migrations run automatically on startup against the fresh CI database.
        env:
          DATABASE_URL: postgres://pudim:t@localhost:5432/pudimproductivity?sslmode=disable
          PORT: "18080"
          RABBITMQ_URL: ""
          REDIS_URL: ""
          LOG_LEVEL: warn
        run: |
          nohup /tmp/pudim-backend > /tmp/backend.log 2>&1 &
          echo "backend pid: $!"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:18080/api/v1/health > /dev/null; then
              echo "backend healthy after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:18080/api/v1/health || { echo "backend never became healthy"; cat /tmp/backend.log; exit 1; }
      - name: Install k6
        # Check latest: https://github.com/grafana/k6/releases
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v2.1.0/k6-v2.1.0-linux-amd64.tar.gz | tar -xz -C /tmp
          echo "/tmp/k6-v2.1.0-linux-amd64" >> "$GITHUB_PATH"
      - name: Run smoke load test
        env:
          BASE_URL: http://localhost:18080/api/v1
        run: k6 run infra/k6/smoke.js