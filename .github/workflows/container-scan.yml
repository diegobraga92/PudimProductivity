name: Container Scan (Trivy)

on:
  workflow_call:
    inputs:
      image-name:
        description: Docker image name (scanned as <image-name>:ci)
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile, relative to the repo root
        required: true
        type: string
      build-context:
        description: Docker build context
        required: true
        type: string

permissions:
  contents: read

jobs:
  scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        # --pull so the scan reflects today's base image instead of cached.
        run: docker build --pull -t ${{ inputs.image-name }}:ci -f ${{ inputs.dockerfile }} ${{ inputs.build-context }}
      - name: Run Trivy (fail on fixable CRITICAL/HIGH)
        # Findings without an upstream fix cannot be actioned by a dependency
        # bump, so they are reported by the next step instead of turning every
        # unrelated pull request red.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.image-name }}:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Run Trivy (informational, includes unfixed)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.image-name }}:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: false
