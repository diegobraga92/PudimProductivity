name: Container Scan (Trivy)

on:
  workflow_call:
    inputs:
      image-name:
        description: Docker image name (scanned as <image-name>:ci)
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile, relative to the repo root
        required: true
        type: string
      build-context:
        description: Docker build context
        required: true
        type: string

permissions:
  contents: read

jobs:
  scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t ${{ inputs.image-name }}:ci -f ${{ inputs.dockerfile }} ${{ inputs.build-context }}
      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.image-name }}:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
