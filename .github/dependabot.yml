version: 2

updates:
  - package-ecosystem: gomod
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    labels: ["dependencies", "web"]
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/desktop"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    labels: ["dependencies", "desktop"]
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      desktop-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: gradle
    directory: "/mobile"
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: ["dependencies", "mobile"]
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "06:15"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/backend"
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend", "docker"]
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      docker-backend:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/web"
    schedule:
      interval: weekly
      day: wednesday
      time: "06:15"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: ["dependencies", "web", "docker"]
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      docker-web:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "06:30"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      compose-images:
        patterns: ["*"]
