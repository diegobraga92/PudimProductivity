services:
  postgres:
    image: postgres:18-alpine  # https://hub.docker.com/_/postgres/tags?name=alpine
    container_name: pudim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pudim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — copy .env.example to .env and fill it in}
      POSTGRES_DB: ${POSTGRES_DB:-pudimproductivity}
    ports:
      - "${DB_PORT:-5433}:5432"
    # Postgres 18+ images require a single mount at /var/lib/postgresql (data is
    # stored in a major-version subdirectory, e.g. /var/lib/postgresql/18/docker).
    # The old pre-18 path /var/lib/postgresql/data makes the entrypoint exit with
    # "there appears to be PostgreSQL data in /var/lib/postgresql/data" on 18+.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pudim} -d ${POSTGRES_DB:-pudimproductivity}"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine  # https://hub.docker.com/_/rabbitmq/tags?name=management-alpine
    container_name: pudim-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pudim}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS must be set}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailpit — local email capture for the Phase 3 notifications worker.
  # UI: http://localhost:8025 ; SMTP: localhost:1025
  mailpit:
    image: axllent/mailpit:latest  # https://hub.docker.com/r/axllent/mailpit
    container_name: pudim-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  # Jaeger for OpenTelemetry traces (Phase 6). Start with:
  #   docker compose --profile tracing up -d
  # then open http://localhost:16686 to view spans. The backend exports spans
  # over OTLP/HTTP when OTEL_EXPORTER_OTLP_ENDPOINT is set (see .env.example).
  jaeger:
    profiles:
      - tracing
    image: jaegertracing/all-in-one:1.65.0
    container_name: pudim-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4318:4318"   # OTLP HTTP receiver

  backend:
    build:
      context: ./backend
    container_name: pudim-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      # Comma-separated CORS allow-list for cross-origin clients. The Electron
      # desktop app serves the SPA from app://bundle — allow it to use the
      # desktop app against this LAN deployment (see web/.env.desktop).
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-pudim}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pudimproductivity}?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      # Phase 3 notifications: RabbitMQ + Mailpit (SMTP) + optional FCM.
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-pudim}:${RABBITMQ_PASS}@rabbitmq:5672/"
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_FROM: "pudim@localhost"
      NOTIFY_EMAIL: "${NOTIFY_EMAIL:-pudim@localhost}"
      FCM_DEVICE_TOKEN: "${FCM_DEVICE_TOKEN:-}"
      # OpenTelemetry OTLP/HTTP endpoint. Empty by default (spans go to stdout
      # only). Set to http://jaeger:4318 in .env and run `docker compose
      # --profile tracing up` to view traces in Jaeger (http://localhost:16686).
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      # Media storage (recipe images). Priority: S3_MEDIA_BUCKET (real S3 or
      # any S3-compatible store) → local disk (MEDIA_STORAGE=local). Unset both
      # to disable image uploads (degraded mode).
      S3_MEDIA_BUCKET: "${S3_MEDIA_BUCKET:-}"
      S3_MEDIA_REGION: "${S3_MEDIA_REGION:-us-east-1}"
      MEDIA_STORAGE: "${MEDIA_STORAGE:-}"
      MEDIA_LOCAL_DIR: "/data/media"
      MEDIA_PUBLIC_BASE_URL: "${MEDIA_PUBLIC_BASE_URL:-}"
      # Soundscape ambient sounds: defaults ship in the image and are seeded
      # into the soundsdata volume on startup (existing files are kept).
      SOUNDS_DIR: "/app/sounds"
      SOUNDS_BUNDLED_DIR: "/app/sounds-default"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - mediadata:/data/media
      - soundsdata:/app/sounds
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: pudim-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine  # https://hub.docker.com/_/redis/tags?name=alpine
    container_name: pudim-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  rabbitmqdata:
  redisdata:
  mediadata:
  soundsdata:
