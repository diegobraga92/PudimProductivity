services:
  postgres:
    image: postgres:18-alpine  # https://hub.docker.com/_/postgres/tags?name=alpine
    container_name: pudim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pudim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — copy .env.example to .env and fill it in}
      POSTGRES_DB: ${POSTGRES_DB:-pudimproductivity}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pudim} -d ${POSTGRES_DB:-pudimproductivity}"]
      interval: 5s
      timeout: 3s
      retries: 5

  jaeger:
    profiles:
      - tracing
    image: jaegertracing/all-in-one:1.65.0
    container_name: pudim-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4318:4318"   # OTLP HTTP receiver

  backend:
    build:
      context: ./backend
    container_name: pudim-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-pudim}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pudimproductivity}?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      S3_MEDIA_BUCKET: "${S3_MEDIA_BUCKET:-}"
      S3_MEDIA_REGION: "${S3_MEDIA_REGION:-us-east-1}"
      MEDIA_STORAGE: "${MEDIA_STORAGE:-}"
      MEDIA_LOCAL_DIR: "/data/media"
      MEDIA_PUBLIC_BASE_URL: "${MEDIA_PUBLIC_BASE_URL:-}"
      SOUNDS_DIR: "/app/sounds"
      SOUNDS_BUNDLED_DIR: "/app/sounds-default"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - mediadata:/data/media
      - soundsdata:/app/sounds
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: pudim-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine  # https://hub.docker.com/_/redis/tags?name=alpine
    container_name: pudim-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
  mediadata:
  soundsdata:
