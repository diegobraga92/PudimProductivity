services:
  postgres:
    image: postgres:16-alpine
    container_name: pudim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pudim
      POSTGRES_PASSWORD: pudim_dev
      POSTGRES_DB: pudimproductivity
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pudim -d pudimproductivity"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: pudim-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: pudim
      RABBITMQ_DEFAULT_PASS: pudim_dev
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: pudim-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://pudim:pudim_dev@postgres:5432/pudimproductivity?sslmode=disable"
      LOG_LEVEL: "debug"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./web
    container_name: pudim-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  rabbitmqdata:

