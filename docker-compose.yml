services:
  postgres:
    image: postgres:16-alpine
    container_name: pudim-postgres
    environment:
      POSTGRES_USER: pudim
      POSTGRES_PASSWORD: pudim_dev
      POSTGRES_DB: pudimproductivity
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pudim -d pudimproductivity"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: pudim-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: pudim
      RABBITMQ_DEFAULT_PASS: pudim_dev
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  rabbitmqdata:
