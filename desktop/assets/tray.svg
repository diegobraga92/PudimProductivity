<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Monochrome tray icon: black pudding silhouette with the "P" knocked out.
       (macOS template convention: black + alpha. Works on Linux trays too.) -->
  <defs>
    <mask id="trayMask">
      <!-- Pudding silhouette: white = opaque -->
      <g fill="#FFFFFF">
        <ellipse cx="256" cy="320" rx="160" ry="112"/>
        <path d="M128 192 C128 112 384 112 384 192 L352 320 L160 320 Z"/>
      </g>
      <!-- "P": black = transparent (knocked out) -->
      <g stroke="#000000" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M208 144 V368"/>
        <path d="M208 144 H304 A56 56 0 0 1 304 256 H208"/>
      </g>
    </mask>
  </defs>
  <rect x="0" y="0" width="512" height="512" fill="#000000" mask="url(#trayMask)"/>
</svg>
