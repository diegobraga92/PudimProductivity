# PudimProductivity — Desktop build configuration
# https://www.electron.build/configuration
appId: com.pudimproductivity.app
productName: PudimProductivity
directories:
  output: release
  buildResources: assets
files:
  - dist-electron/**/*
  - dist-web/**/*
  - assets/**/*
asar: true
npmRebuild: false

# Where updates are published (electron-updater reads app-update.yml generated
# from this section).
publish:
  provider: github
  owner: diegobraga92
  repo: PudimProductivity

linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: assets/icon.png
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  icon: assets/icon.png
win:
  target:
    - nsis
  icon: assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
