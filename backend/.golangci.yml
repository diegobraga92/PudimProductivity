version: "2"

linters:
  default: standard
  enable:
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        # Public API types/functions are documented informally; do not force
        # golint-style "exported X should have comment" noise.
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/diegobraga92/pudimproductivity

run:
  timeout: 3m
