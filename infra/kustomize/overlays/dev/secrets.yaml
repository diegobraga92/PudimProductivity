# The base backend Deployment reads DATABASE_URL from the `backend-secrets`
# Secret. A static Secret supplies it for the local demo.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: pudimproductivity
  labels:
    app.kubernetes.io/part-of: pudimproductivity
type: Opaque
stringData:
  database_url: "postgres://pudim:pudim@postgres:5432/pudimproductivity?sslmode=disable"
