apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev overlay — cheapest possible shape: 1 replica each, dev image tags.
resources:
  - ../../base

# Dev images come from a dev build of the repository (CI pushes :dev on main).
images:
  - name: ghcr.io/pudimproductivity/backend
    newTag: dev
  - name: ghcr.io/pudimproductivity/web
    newTag: dev

patches:
  # Point the backend at the dev PostgreSQL (managed outside this repo, e.g.
  # a dev RDS or an in-cluster ephemeral postgres).
  - target:
      kind: ConfigMap
      name: backend-config
    patch: |-
      - op: add
        path: /data/LOG_LEVEL
        value: "debug"
