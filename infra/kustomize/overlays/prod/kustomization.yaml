apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prod overlay — HA shape: 2 backend replicas, pinned production image tag.
# The tag is set by CI (image built from the exact git SHA, e.g. main-<sha>).
resources:
  - ../../base

images:
  - name: ghcr.io/pudimproductivity/backend
    newTag: main
  - name: ghcr.io/pudimproductivity/web
    newTag: main

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: ConfigMap
      name: backend-config
    patch: |-
      - op: add
        path: /data/LOG_LEVEL
        value: "info"
