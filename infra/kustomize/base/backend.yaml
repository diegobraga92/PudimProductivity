apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: pudimproductivity
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: pudimproductivity
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      containers:
        - name: backend
          # Overridden by overlays (see kustomization.yaml `images:`).
          image: ghcr.io/pudimproductivity/backend:latest
          ports:
            - name: http
              containerPort: 8080
          # Liveness = process is up and /health responds; readiness = can serve.
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: backend-config
          # Secrets (DATABASE_URL, RABBITMQ_URL, FCM) must be
          # injected by the overlay via sealed-secrets/ExternalSecret. Do not
          # commit plaintext secrets.
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: database_url
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: pudimproductivity
  labels:
    app.kubernetes.io/name: backend
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
