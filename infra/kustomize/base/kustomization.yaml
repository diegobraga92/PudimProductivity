apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ArgoCD points here via the ApplicationSet in infra/argocd/. Overlays in
# overlays/dev and overlays/prod set image tags, replicas and environment.
resources:
  - namespace.yaml
  - backend-config.yaml
  - backend.yaml
  - web.yaml

# Common labels across all resources.
labels:
  - pairs:
      app.kubernetes.io/managed-by: argocd
