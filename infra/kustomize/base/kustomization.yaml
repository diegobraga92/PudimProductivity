apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ArgoCD points here via the local-demo Application in infra/argocd/local-demo/.
resources:
  - namespace.yaml
  - backend-config.yaml
  - backend.yaml
  - web.yaml

# Common labels across all resources.
labels:
  - pairs:
      app.kubernetes.io/managed-by: argocd
